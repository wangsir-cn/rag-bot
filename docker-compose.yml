services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ragbot-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-ragbot}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 首次启动时自动建库建表（幂等脚本）
      - ./backend/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-ragbot}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: ragbot-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # 默认连 compose 内的 postgres 容器；.env 里配置了 DB_HOST 则连指定主机
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-ragbot}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-change-me}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      RAG_STORAGE_PATH: /app/storage
      STORAGE_TYPE: ${STORAGE_TYPE:-minio}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://localhost:9000}
      MINIO_BUCKET: ${MINIO_BUCKET:-rag-bot}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-admin}
      RAG_CHUNK_STRATEGY: ${RAG_CHUNK_STRATEGY:-SEMANTIC}
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-800}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-120}
      RAG_TOP_K: ${RAG_TOP_K:-8}
      RAG_CACHE_ENABLED: ${RAG_CACHE_ENABLED:-false}
      RAG_RERANK_ENABLED: ${RAG_RERANK_ENABLED:-false}
    ports:
      - "8080:8080"
    volumes:
      - ./storage:/app/storage

  frontend:
    build:
      context: ./frontend
    container_name: ragbot-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
